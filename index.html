<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="robots" content="noindex, nofollow" />
  <meta name="apple-mobile-web-app-title" content="愛・ジン・シュシュ収支" />
  <title>愛・ジン・シュシュ収支</title>
  <style>
    :root { --ink:#20313d; --muted:#71808a; --line:#e6eaeb; --paper:#fffdf8; --bg:#f4f6f3; --accent:#e8664e; --teal:#1c8b85; --soft:#fff0e9; }
    * { box-sizing:border-box; }
    body { margin:0; background:var(--bg); color:var(--ink); font-family:"Yu Gothic UI","Hiragino Sans",system-ui,sans-serif; }
    .wrap { max-width:1060px; margin:auto; padding:38px 22px 58px; }
    header { display:flex; justify-content:space-between; align-items:flex-end; gap:16px; margin-bottom:26px; }
    h1 { font-size:clamp(25px,4vw,38px); line-height:1.12; letter-spacing:.02em; margin:0; }
    h1 span { color:var(--accent); }
    .date { color:var(--muted); font-size:14px; white-space:nowrap; }
    .header-tools { display:flex; align-items:center; gap:8px; }
    .tool { padding:8px 10px; border:1px solid #d9dfdf; background:#fff; color:#4f6169; font-size:12px; white-space:nowrap; }
    .tool:hover { border-color:var(--teal); color:#126d68; }
    .grid { display:grid; grid-template-columns:330px 1fr; gap:22px; align-items:start; }
    .card { background:var(--paper); border:1px solid var(--line); border-radius:18px; box-shadow:0 5px 18px #18312a08; }
    .form { padding:22px; position:sticky; top:16px; }
    h2 { font-size:16px; margin:0 0 18px; letter-spacing:.05em; }
    label { font-size:13px; color:var(--muted); display:block; margin:15px 0 6px; }
    input, select { width:100%; border:1px solid #d9dfdf; border-radius:10px; padding:11px 12px; background:#fff; font:inherit; color:var(--ink); }
    input:focus, select:focus { outline:3px solid #bce4df; border-color:var(--teal); }
    .options { display:grid; grid-template-columns:1fr 1fr; gap:8px; }
    .option { position:relative; }
    .option input { position:absolute; opacity:0; }
    .option span { display:block; text-align:center; padding:10px 5px; border:1px solid #d9dfdf; border-radius:10px; color:var(--muted); cursor:pointer; }
    .option input:checked + span { border-color:var(--teal); background:#e7f6f4; color:#126d68; font-weight:700; }
    button { border:0; font:inherit; cursor:pointer; border-radius:10px; }
    .add { width:100%; margin-top:22px; padding:13px; background:var(--accent); color:#fff; font-weight:700; box-shadow:0 5px 10px #e8664e35; }
    .add:hover { filter:brightness(.96); }
    .content { display:grid; gap:22px; }
    .totals { padding:22px; }
    .period { display:flex; justify-content:space-between; align-items:center; gap:12px; margin-bottom:18px; }
    .period h2 { margin:0; }
    #month { width:155px; padding:8px; font-size:14px; }
    .stats { display:grid; grid-template-columns:repeat(3,1fr); gap:12px; }
    .stat { padding:15px; border-radius:13px; background:#f7f8f5; }
    .stat:nth-child(2) { background:#e8f6f4; } .stat:nth-child(3) { background:var(--soft); }
    .stat small { display:block; color:var(--muted); margin-bottom:6px; font-size:12px; }
    .stat strong { font-size:22px; letter-spacing:-.02em; }
    .settlement { margin-top:16px; padding:13px 15px; border-radius:11px; background:#fff5d9; font-size:14px; line-height:1.55; }
    .history { padding:22px; }
    .expense-area { margin-top:22px; display:grid; grid-template-columns:330px 1fr; gap:22px; align-items:start; }
    .expense-form { padding:22px; }
    .person-stats { display:grid; grid-template-columns:repeat(3,1fr); gap:9px; margin-top:16px; }
    .person-stat { padding:11px; border:1px solid var(--line); border-radius:11px; font-size:12px; }
    .person-stat b { display:block; margin-bottom:7px; font-size:13px; }
    .person-stat span { display:block; color:var(--muted); line-height:1.55; }
    .history-head { display:flex; justify-content:space-between; align-items:center; gap:10px; }
    .history-head h2 { margin:0; }
    .clear { color:var(--muted); background:none; padding:6px; font-size:12px; text-decoration:underline; }
    .records { margin-top:14px; }
    .record { display:grid; grid-template-columns:44px 1fr auto 30px; gap:11px; align-items:center; padding:13px 2px; border-top:1px solid var(--line); }
    .badge { width:40px; height:40px; display:grid; place-items:center; border-radius:50%; background:#e7f6f4; color:#146c67; font-weight:800; }
    .record:nth-child(even) .badge { background:var(--soft); color:#b64d3a; }
    .record-title { font-weight:700; font-size:14px; }
    .record-sub { color:var(--muted); font-size:12px; margin-top:3px; }
    .amount { font-weight:800; white-space:nowrap; }
    .delete { width:28px; height:28px; color:#a2adaf; background:transparent; font-size:20px; line-height:1; }
    .delete:hover { color:var(--accent); background:var(--soft); }
    .empty { text-align:center; color:var(--muted); padding:38px 10px 20px; font-size:14px; }
    footer { color:var(--muted); font-size:12px; text-align:center; margin-top:24px; }
    .message { min-height:20px; margin:12px 0 -8px; text-align:center; font-size:13px; color:#176e69; }
    .message.error { color:#b64d3a; }
    @media(max-width:760px) { .wrap{padding:22px 14px 42px}header{align-items:flex-start;flex-direction:column;margin-bottom:18px}.header-tools{width:100%}.tool{flex:1}.grid,.expense-area{grid-template-columns:1fr;gap:15px}.card{border-radius:15px}.form,.expense-form{position:static;padding:18px}.totals,.history{padding:18px}.stats{grid-template-columns:1fr 1fr;gap:9px}.person-stats{grid-template-columns:1fr}.stat{padding:13px}.stat strong{font-size:19px}.period{align-items:flex-start;flex-direction:column;gap:8px}#month{width:100%}.record{grid-template-columns:38px 1fr auto 50px;gap:8px}.badge{width:35px;height:35px}.record-title{font-size:13px}.record-sub{font-size:11px}.amount{font-size:13px}.settlement{font-size:13px}.date{display:none} }
  </style>
</head>
<body>
  <main class="wrap">
    <header><div><h1>愛・ジン・シュシュ収支</h1></div><div class="header-tools"><button class="tool" id="backup">バックアップ</button><button class="tool" id="restore">復元</button><input id="restoreFile" type="file" accept="application/json,.json" hidden><div class="date" id="today"></div></div></header>
    <div class="grid">
      <section class="card form">
        <h2>送迎を記録</h2>
        <label for="rideDate">日付</label><input id="rideDate" type="date">
        <label for="store">店名・利用先</label><input id="store" type="text" placeholder="例：○○タクシー、ガソリンスタンド">
        <label for="amountInput">金額</label><input id="amountInput" inputmode="numeric" type="number" min="0" step="10" placeholder="例：1200">
        <label for="incomeWork">どの仕事の収入？</label><select id="incomeWork"><option value="">選択なし</option><option>シュシュ</option><option>ジン</option><option>キッチン</option></select>
        <button class="add" id="add">＋ 記録する</button>
      </section>
      <section class="content">
        <section class="card totals">
          <div class="period"><h2>今月のまとめ</h2><input id="month" type="month"></div>
          <div class="stats"><div class="stat"><small>総収入</small><strong id="total">¥0</strong></div><div class="stat"><small>総経費</small><strong id="expenseTotal">¥0</strong></div><div class="stat"><small>利益</small><strong id="profitTotal">¥0</strong></div></div>
          <div class="person-stats" id="personStats"></div>
          <div class="settlement" id="settlement">日付・店名・金額を入力して記録しましょう。</div>
        </section>
        <section class="card history"><div class="history-head"><h2>送迎の履歴</h2><button class="clear" id="clear">この月の記録を消す</button></div><div class="records" id="records"></div></section>
      </section>
    </div>
    <div class="expense-area">
      <section class="card expense-form"><h2 id="expenseFormTitle">経費を記録</h2>
        <label for="expenseDate">日付</label><input id="expenseDate" type="date">
        <label for="expenseAmount">金額</label><input id="expenseAmount" inputmode="numeric" type="number" min="0" step="1" placeholder="例：1200">
        <label for="expenseCategory">経費カテゴリー</label><select id="expenseCategory"><option>ガソリン代</option><option>駐車場代</option><option>高速代</option><option>車両費</option><option>自動車保険</option><option>携帯・通信費</option><option>消耗品費</option><option>その他</option></select>
        <label for="expensePayee">支払先</label><input id="expensePayee" type="text" placeholder="例：ENEOS">
        <label for="expenseMemo">メモ（任意）</label><input id="expenseMemo" type="text" placeholder="例：9月分">
        <label for="expenseWork">どの仕事の経費？</label><select id="expenseWork"><option>シュシュ</option><option>ジン</option><option>キッチン</option><option>共通</option></select>
        <button class="add" id="saveExpense">＋ 経費を記録</button>
      </section>
      <section class="card history"><div class="history-head"><h2>経費の履歴</h2><button class="clear" id="clearExpenses">この月の経費を消す</button></div><div class="records" id="expenseRecords"></div></section>
    </div>
    <div class="message" id="message" role="status" aria-live="polite"></div>
    <footer>この端末内に保存されます。</footer>
  </main>
  <script>
    const $ = id => document.getElementById(id);
    const yen = n => new Intl.NumberFormat('ja-JP',{style:'currency',currency:'JPY',maximumFractionDigits:0}).format(n);
    const localDate = new Date(Date.now()-new Date().getTimezoneOffset()*60000).toISOString().slice(0,10);
    const currentMonth = localDate.slice(0,7);
    $('rideDate').value = localDate; $('month').value = currentMonth;
    $('today').textContent = new Intl.DateTimeFormat('ja-JP',{year:'numeric',month:'long',day:'numeric',weekday:'short'}).format(new Date());
    const STORAGE_KEY = 'sougeiEntries', EXPENSE_KEY = 'sougeiExpenses';
    const jobs=['シュシュ','ジン','キッチン'];
    let entries, expenses, editingExpenseId=null;
    try { entries = JSON.parse(localStorage.getItem(STORAGE_KEY) || '[]').map(x => ({...x, store:x.store || x.memo || '送迎代'})); } catch { entries = []; }
    try { expenses = JSON.parse(localStorage.getItem(EXPENSE_KEY) || '[]'); if(!Array.isArray(expenses)) expenses=[]; } catch { expenses = []; }
    $('expenseDate').value=localDate;
    function showMessage(text, isError=false){ const target=$('message'); target.textContent=text; target.className=isError?'message error':'message'; }
    function render(){
      const month = $('month').value;
      const list = entries.filter(x=>x.date.startsWith(month)).sort((a,b)=>b.date.localeCompare(a.date));
      const expenseList=expenses.filter(x=>x.date&&x.date.startsWith(month)).sort((a,b)=>b.date.localeCompare(a.date));
      const all=list.reduce((s,x)=>s+Number(x.amount||0),0), expenseAll=expenseList.reduce((s,x)=>s+Number(x.amount||0),0);
      $('total').textContent=yen(all); $('expenseTotal').textContent=yen(expenseAll); $('profitTotal').textContent=yen(all-expenseAll);
      $('settlement').textContent = all===0&&expenseAll===0 ? 'この月の記録はありません。' : `${month.replace('-','年')}月の利益は ${yen(all-expenseAll)} です。`;
      $('personStats').innerHTML=jobs.map(job=>{const income=list.filter(x=>x.work===job||x.store===job).reduce((s,x)=>s+Number(x.amount||0),0);const cost=expenseList.filter(x=>x.work===job||x.work==='共通').reduce((s,x)=>s+Number(x.amount||0),0);return `<div class="person-stat"><b>${job}</b><span>収入 ${yen(income)}</span><span>経費 ${yen(cost)}</span><span>利益 ${yen(income-cost)}</span></div>`}).join('');
      $('records').innerHTML = list.length ? list.map(x=>`<article class="record"><div class="badge">店</div><div><div class="record-title">${escapeHtml(x.store)}</div><div class="record-sub">${x.date.replaceAll('-','/')}</div></div><div class="amount">${yen(x.amount)}</div><button class="delete" data-id="${x.id}" aria-label="削除">×</button></article>`).join('') : '<div class="empty">この月の送迎記録はありません。</div>';
      $('expenseRecords').innerHTML=expenseList.length?expenseList.map(x=>`<article class="record"><div class="badge">費</div><div><div class="record-title">${escapeHtml(x.category)} ・ ${escapeHtml(x.payee)}</div><div class="record-sub">${x.date.replaceAll('-','/')} ・ ${escapeHtml(x.work)}${x.memo?' ・ '+escapeHtml(x.memo):''}</div></div><div class="amount">${yen(x.amount)}</div><div><button class="delete edit-expense" data-id="${x.id}" aria-label="編集">✎</button><button class="delete delete-expense" data-id="${x.id}" aria-label="削除">×</button></div></article>`).join(''):'<div class="empty">この月の経費記録はありません。</div>';
    }
    function escapeHtml(text){ return text.replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[c])); }
    function save(){localStorage.setItem(STORAGE_KEY,JSON.stringify(entries));render();}
    function saveExpenses(){localStorage.setItem(EXPENSE_KEY,JSON.stringify(expenses));render();}
    $('add').onclick=()=>{const amount=Number($('amountInput').value), store=$('store').value.trim(), work=$('incomeWork').value; if(!store){$('store').focus();return;} if(!amount||amount<0){$('amountInput').focus();return;} entries.push({id:crypto.randomUUID(),date:$('rideDate').value,store,amount,work}); $('store').value='';$('amountInput').value='';$('incomeWork').value=''; save();};
    $('month').onchange=render;
    $('records').onclick=e=>{const id=e.target.dataset.id;if(id){entries=entries.filter(x=>x.id!==id);save();}};
    $('clear').onclick=()=>{const month=$('month').value;if(entries.some(x=>x.date.startsWith(month))&&confirm(`${month} の記録をすべて削除しますか？`)){entries=entries.filter(x=>!x.date.startsWith(month));save();}};
    $('saveExpense').onclick=()=>{const amount=Number($('expenseAmount').value),payee=$('expensePayee').value.trim();if(!payee){$('expensePayee').focus();return;}if(!amount||amount<0){$('expenseAmount').focus();return;}const data={id:editingExpenseId||crypto.randomUUID(),date:$('expenseDate').value,amount,category:$('expenseCategory').value,payee,memo:$('expenseMemo').value.trim(),work:$('expenseWork').value};if(editingExpenseId)expenses=expenses.map(x=>x.id===editingExpenseId?data:x);else expenses.push(data);editingExpenseId=null;$('expenseFormTitle').textContent='経費を記録';$('saveExpense').textContent='＋ 経費を記録';$('expenseAmount').value='';$('expensePayee').value='';$('expenseMemo').value='';saveExpenses();};
    $('expenseRecords').onclick=e=>{const id=e.target.dataset.id;if(!id)return;if(e.target.classList.contains('delete-expense')){if(confirm('この経費を削除しますか？')){expenses=expenses.filter(x=>x.id!==id);saveExpenses();}}if(e.target.classList.contains('edit-expense')){const x=expenses.find(v=>v.id===id);if(!x)return;editingExpenseId=id;$('expenseDate').value=x.date;$('expenseAmount').value=x.amount;$('expenseCategory').value=x.category;$('expensePayee').value=x.payee;$('expenseMemo').value=x.memo||'';$('expenseWork').value=x.work;$('expenseFormTitle').textContent='経費を編集';$('saveExpense').textContent='変更を保存';window.scrollTo({top:document.querySelector('.expense-area').offsetTop-12,behavior:'smooth'});}};
    $('clearExpenses').onclick=()=>{const month=$('month').value;if(expenses.some(x=>x.date&&x.date.startsWith(month))&&confirm(`${month} の経費をすべて削除しますか？`)){expenses=expenses.filter(x=>!x.date||!x.date.startsWith(month));saveExpenses();}};
    function backupFilename(){ const d=new Date(); const pad=n=>String(n).padStart(2,'0'); return `sougei-backup-${d.getFullYear()}${pad(d.getMonth()+1)}${pad(d.getDate())}-${pad(d.getHours())}${pad(d.getMinutes())}${pad(d.getSeconds())}.json`; }
    $('backup').onclick=()=>{ try { const backup={app:'sougei-kanri',version:2,exportedAt:new Date().toISOString(),data:{[STORAGE_KEY]:localStorage.getItem(STORAGE_KEY),[EXPENSE_KEY]:localStorage.getItem(EXPENSE_KEY)}}; const blob=new Blob([JSON.stringify(backup,null,2)],{type:'application/json'}); const link=document.createElement('a'); link.href=URL.createObjectURL(blob); link.download=backupFilename(); document.body.appendChild(link); link.click(); link.remove(); URL.revokeObjectURL(link.href); showMessage('バックアップを保存しました。'); } catch { showMessage('バックアップの保存に失敗しました。もう一度お試しください。',true); } };
    $('restore').onclick=()=>{ $('restoreFile').value=''; $('restoreFile').click(); };
    $('restoreFile').onchange=e=>{const file=e.target.files[0];if(!file)return;const reader=new FileReader();reader.onerror=()=>showMessage('ファイルを読み込めませんでした。',true);reader.onload=()=>{try{const backup=JSON.parse(reader.result),data=backup&&backup.data;if(!backup||backup.app!=='sougei-kanri'||!data||!Object.prototype.hasOwnProperty.call(data,STORAGE_KEY)||(data[STORAGE_KEY]!==null&&typeof data[STORAGE_KEY]!=='string')||(data[EXPENSE_KEY]!==undefined&&data[EXPENSE_KEY]!==null&&typeof data[EXPENSE_KEY]!=='string'))throw new Error();if(data[STORAGE_KEY]!==null&&!Array.isArray(JSON.parse(data[STORAGE_KEY])))throw new Error();if(data[EXPENSE_KEY]!=null&&!Array.isArray(JSON.parse(data[EXPENSE_KEY])))throw new Error();if(!confirm('現在のデータを上書きします。よろしいですか？'))return;if(data[STORAGE_KEY]===null)localStorage.removeItem(STORAGE_KEY);else localStorage.setItem(STORAGE_KEY,data[STORAGE_KEY]);if(Object.prototype.hasOwnProperty.call(data,EXPENSE_KEY)){if(data[EXPENSE_KEY]===null)localStorage.removeItem(EXPENSE_KEY);else localStorage.setItem(EXPENSE_KEY,data[EXPENSE_KEY]);}location.reload();}catch{showMessage('このアプリのバックアップファイルではないか、ファイルが壊れています。',true);}};reader.readAsText(file);};
    render();
  </script>
</body>
</html>
