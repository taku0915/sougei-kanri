<style>
:root{--ink:#181a1c;--muted:#737980;--bg:#f2f2ef;--card:#fff;--line:#e5e5e0;--gold:#b38a43;--black:#151719;--red:#bd5b50;--green:#277869;--nav:76px}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"Hiragino Sans","Yu Gothic",sans-serif;padding-bottom:calc(var(--nav) + env(safe-area-inset-bottom))}button,input,select{font:inherit}button{border:0;cursor:pointer}.app{max-width:760px;margin:auto;padding:16px 14px 20px}.head{display:flex;justify-content:space-between;align-items:center;margin:4px 2px 17px}.brand{font-size:24px;font-weight:850;letter-spacing:.08em}.brand small{display:block;color:var(--gold);font-size:9px;letter-spacing:.17em;margin-top:3px}.today{font-size:12px;color:var(--muted)}.screen{display:none}.screen.active{display:block}.card{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:17px;margin-bottom:12px;box-shadow:0 3px 12px #11111108}.title{font-size:15px;margin:0 0 13px;letter-spacing:.03em}.sub{font-size:12px;color:var(--muted);margin:-5px 0 13px;line-height:1.5}.hero{background:linear-gradient(135deg,#151719,#2b3034);color:white;border:0;padding:22px;position:relative;overflow:hidden}.hero:after{content:"";position:absolute;width:130px;height:130px;border:20px solid #b38a4344;border-radius:50%;right:-45px;top:-48px}.hero small{color:#d6c29d;font-size:12px;letter-spacing:.08em}.hero b{display:block;font-size:36px;letter-spacing:-.04em;margin:6px 0 2px}.hero span{font-size:12px;color:#d7d9da}.overview{display:grid;grid-template-columns:1fr 1fr;gap:8px}.metric{padding:12px;background:#f7f7f4;border-radius:12px}.metric small{display:block;color:var(--muted);font-size:11px;margin-bottom:5px}.metric b{font-size:16px}.metric.red b{color:var(--red)}.metric.green b{color:var(--green)}.grid{display:grid;grid-template-columns:132px 1fr;gap:14px;align-items:center}.pie{width:132px;height:132px;border-radius:50%;background:#e9e9e5;position:relative}.pie:after{content:"";position:absolute;inset:31px;border-radius:50%;background:#fff}.pie.empty{display:grid;place-items:center;color:var(--muted);font-size:12px}.legend{display:grid;gap:8px}.leg{display:grid;grid-template-columns:10px 1fr auto;gap:7px;align-items:center;font-size:12px}.dot{height:10px;width:10px;border-radius:50%}.leg small{display:block;color:var(--muted);font-size:10px;text-align:right}.switch,.tabs{display:grid;grid-template-columns:1fr 1fr;gap:7px;margin-bottom:14px}.switch button,.tabs button{padding:11px;border-radius:10px;background:#ecece7;color:#656b70;font-size:13px;font-weight:750}.switch button.active,.tabs button.active{background:var(--black);color:#fff}label{display:block;font-size:12px;font-weight:650;color:#596167;margin:14px 0 6px}input,select{width:100%;min-height:45px;padding:11px;border:1px solid #d9d9d4;border-radius:11px;background:white;color:var(--ink)}input:focus,select:focus{outline:3px solid #d8c5a255;border-color:var(--gold)}.two{display:grid;grid-template-columns:1fr 1fr;gap:9px}.ai{background:#f8f1e6;border:1px solid #ead8ba;border-radius:13px;padding:2px 12px 13px;margin-top:14px}.net{margin-top:11px;padding:10px;background:white;border-radius:10px;color:#665026;font-size:13px}.net b{float:right;font-size:18px}.primary{width:100%;margin-top:20px;padding:14px;border-radius:12px;background:var(--black);color:white;font-weight:800}.secondary{padding:9px 10px;border-radius:9px;background:#efefeb;color:#4e565a;font-size:12px;font-weight:750}.hidden{display:none!important}.toolbar{display:flex;gap:8px;justify-content:space-between;align-items:center;margin-bottom:12px}.month{width:145px;min-height:39px;padding:7px;font-size:13px}.record{display:grid;grid-template-columns:38px 1fr auto;gap:10px;align-items:center;padding:12px 0;border-top:1px solid var(--line)}.record:first-child{border-top:0}.badge{height:36px;width:36px;border-radius:50%;display:grid;place-items:center;background:#e9f0f3;color:#39799d;font-size:12px;font-weight:800}.badge.exp{background:#f5ece9;color:#a9584c}.rtitle{font-size:13px;font-weight:750}.rsub{font-size:11px;color:var(--muted);line-height:1.4;margin-top:3px}.ramount{font-size:14px;font-weight:800;text-align:right}.actions{display:flex;justify-content:flex-end;gap:5px;margin-top:5px}.icon{width:29px;height:29px;border-radius:8px;background:#f3f3ef;color:#5f6669;font-size:15px}.delete{color:var(--red);background:#fff2f1}.empty{text-align:center;color:var(--muted);font-size:13px;padding:34px 8px}.rows{display:grid}.row{display:flex;justify-content:space-between;gap:12px;padding:11px 1px;border-bottom:1px solid var(--line);font-size:13px}.row b{font-variant-numeric:tabular-nums}.row.final{font-size:15px;font-weight:800;color:var(--green)}.tags{display:flex;gap:7px;flex-wrap:wrap}.tag{padding:7px 9px;background:#f0f0ec;border-radius:9px;font-size:12px}.tag button{margin-left:5px;background:transparent;color:#a66}.setting-add{display:flex;gap:8px;margin-top:10px}.setting-add input{min-height:40px;padding:8px}.message{min-height:20px;text-align:center;font-size:12px;color:var(--green);padding:4px}.message.error{color:var(--red)}.footer{text-align:center;color:var(--muted);font-size:11px;padding:4px}.nav{position:fixed;z-index:10;bottom:0;left:0;right:0;height:calc(var(--nav) + env(safe-area-inset-bottom));padding:8px 8px calc(8px + env(safe-area-inset-bottom));background:#fffffff5;border-top:1px solid #e2e2de;display:flex;justify-content:center;gap:2px}.nav button{flex:1;max-width:142px;border-radius:12px;background:transparent;color:#808589;font-size:10px;font-weight:700}.nav span{display:block;font-size:20px;line-height:23px}.nav button.active{background:#17191b;color:#fff}@media(min-width:620px){.dash{display:grid;grid-template-columns:1fr 1fr;gap:12px}.dash .card{margin-bottom:0}}@media(max-width:370px){.grid{grid-template-columns:112px 1fr}.pie{width:112px;height:112px}.pie:after{inset:27px}.metric{padding:10px}.metric b{font-size:14px}}
</style></head><body>
<main class="app"><header class="head"><div class="brand">裏帳簿<small>PERSONAL FINANCE</small></div><div id="today" class="today"></div></header>
<section id="home" class="screen active"><article class="card hero"><small>今月の収支</small><b id="balance">¥0</b><span>実受取ベースの収入 − 経費</span></article><article class="card"><h2 class="title">今月の概要</h2><div class="overview"><div class="metric"><small>総支給ベースの収入合計</small><b id="grossTotal">¥0</b></div><div class="metric red"><small>控除合計</small><b id="deductTotal">¥0</b></div><div class="metric green"><small>実受取ベースの収入合計</small><b id="netTotal">¥0</b></div><div class="metric"><small>経費合計</small><b id="expenseTotal">¥0</b></div></div></article><div class="dash"><article class="card"><h2 class="title">今月の収入内訳</h2><div class="grid"><div id="incomePie" class="pie"></div><div id="incomeLegend" class="legend"></div></div></article><article class="card"><h2 class="title">今月の経費内訳</h2><div class="grid"><div id="expensePie" class="pie"></div><div id="expenseLegend" class="legend"></div></div></article></div></section>
<section id="input" class="screen"><div class="switch"><button class="active" data-form="income">収入を記録</button><button data-form="expense">経費を記録</button></div><article id="incomeForm" class="card"><h2 id="incomeTitle" class="title">収入を記録</h2><label>日付</label><input id="incomeDate" type="date"><label>収入先</label><select id="incomeWork"></select><div id="plainAmount"><label>金額</label><input id="incomeAmount" type="number" inputmode="numeric" min="0" placeholder="例：7000"></div><div id="aiFields" class="ai"><label>総支給額</label><input id="grossAmount" type="number" inputmode="numeric" min="0" placeholder="例：300000"><div class="two"><div><label>源泉所得税</label><input id="withholdingTax" type="number" inputmode="numeric" min="0" value="0"></div><div><label>その他控除</label><input id="otherDeduction" type="number" inputmode="numeric" min="0" value="0"></div></div><div class="net">実受取額 <b id="netPreview">¥0</b></div></div><label>メモ（任意）</label><input id="incomeMemo" type="text" placeholder="例：9月分の給与"><button id="saveIncome" class="primary">＋ 収入を記録</button></article><article id="expenseForm" class="card hidden"><h2 id="expenseTitle" class="title">経費を記録</h2><label>日付</label><input id="expenseDate" type="date"><label>金額</label><input id="expenseAmount" type="number" inputmode="numeric" min="0" placeholder="例：1200"><label>経費カテゴリー</label><select id="expenseCategory"></select><label>支払先（任意）</label><input id="expensePayee" type="text" placeholder="例：ENEOS"><label>メモ（任意）</label><input id="expenseMemo" type="text"><label>どの仕事の経費？</label><select id="expenseWork"><option>愛</option><option>ジン</option><option>シュシュ</option><option>共通</option></select><button id="saveExpense" class="primary">＋ 経費を記録</button></article></section>
<section id="history" class="screen"><article class="card"><div class="toolbar"><div class="tabs"><button class="active" data-history="income">収入</button><button data-history="expense">経費</button></div><input id="historyMonth" class="month" type="month"></div><div id="incomeHistory"></div><div id="expenseHistory" class="hidden"></div></article></section>
<section id="summary" class="screen"><article class="card"><div class="toolbar"><h2 class="title">月別集計</h2><input id="summaryMonth" class="month" type="month"></div><div id="summaryRows" class="rows"></div><h2 class="title" style="margin-top:20px">経費カテゴリー別</h2><div id="summaryCats" class="rows"></div></article></section>
<section id="settings" class="screen"><article class="card"><h2 class="title">収入先の管理</h2><p class="sub">愛・ジン・シュシュは標準の収入先です。追加した収入先も保存されます。</p><div id="jobTags" class="tags"></div><div class="setting-add"><input id="newJob" placeholder="収入先を追加"><button id="addJob" class="secondary">追加</button></div></article><article class="card"><h2 class="title">経費カテゴリーの管理</h2><div id="catTags" class="tags"></div><div class="setting-add"><input id="newCat" placeholder="カテゴリーを追加"><button id="addCat" class="secondary">追加</button></div></article><article class="card"><h2 class="title">データ</h2><p class="sub">バックアップは端末に保存されます。復元は現在のデータを上書きします。</p><div class="two"><button id="backup" class="secondary">バックアップ</button><button id="restore" class="secondary">復元</button></div><input id="restoreFile" type="file" accept="application/json,.json" hidden></article></section><div id="message" class="message" role="status"></div><div class="footer">データはこの端末内に保存されます。</div></main>
<nav class="nav"><button class="active" data-screen="home"><span>⌂</span>ホーム</button><button data-screen="input"><span>＋</span>入力</button><button data-screen="history"><span>▤</span>履歴</button><button data-screen="summary"><span>◔</span>集計</button><button data-screen="settings"><span>⚙</span>設定</button></nav>
<script>
(()=>{const $=x=>document.getElementById(x),K='sougeiEntries',E='sougeiExpenses',S='urachouboSettings',d=new Date(Date.now()-new Date().getTimezoneOffset()*60000).toISOString().slice(0,10),now=d.slice(0,7),core=['愛','ジン','シュシュ'],base=['ガソリン代','駐車場代','高速代','車両費','自動車保険','携帯・通信費','消耗品費','その他','交通費','飲食代','光熱費','通信費'],colors=['#b38a43','#39799d','#80659a','#277869','#bd5b50','#df9657','#527d9f','#a77287','#6e9c72','#89815b','#777b92','#b06f45'];let entries=[],expenses=[],settings={jobs:[],categories:[]},editI=null,editE=null;
const yen=n=>new Intl.NumberFormat('ja-JP',{style:'currency',currency:'JPY',maximumFractionDigits:0}).format(Number(n)||0),esc=x=>String(x??'').replace(/[&<>'"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#039;','"':'&quot;'}[c])),work=x=>x==='キッチン'?'愛':(x||''),jobs=()=>[...core,...settings.jobs.filter(x=>x&&!core.includes(x))],cats=()=>[...base,...settings.categories.filter(x=>x&&!base.includes(x))],items=(a,m)=>a.filter(x=>x.date&&x.date.slice(0,7)===m),gross=x=>Number(x.grossAmount??x.amount??0)||0,tax=x=>Number(x.withholdingTax||0)||0,other=x=>Number(x.otherDeduction||0)||0,net=x=>work(x.work||x.store)==='愛'&&('grossAmount'in x||'withholdingTax'in x||'otherDeduction'in x)?Math.max(0,gross(x)-tax(x)-other(x)):Number(x.amount||0)||0;
try{let v=JSON.parse(localStorage.getItem(K)||'[]');entries=Array.isArray(v)?v:[]}catch{}try{let v=JSON.parse(localStorage.getItem(E)||'[]');expenses=Array.isArray(v)?v:[]}catch{}try{let v=JSON.parse(localStorage.getItem(S)||'{}');settings={jobs:Array.isArray(v.jobs)?v.jobs:[],categories:Array.isArray(v.categories)?v.categories:[]}}catch{}
function msg(t,b=false){$('message').textContent=t;$('message').className=b?'message error':'message';setTimeout(()=>{$('message').textContent===''+t&&($('message').textContent='')},3500)}function saveI(){localStorage.setItem(K,JSON.stringify(entries));render()}function saveE(){localStorage.setItem(E,JSON.stringify(expenses));render()}function saveS(){localStorage.setItem(S,JSON.stringify(settings));render()}function total(m){let a=items(entries,m),e=items(expenses,m),g=a.reduce((s,x)=>s+gross(x),0),c=a.reduce((s,x)=>s+tax(x)+other(x),0),n=a.reduce((s,x)=>s+net(x),0),z=e.reduce((s,x)=>s+(Number(x.amount)||0),0);return{a,e,g,c,n,z,b:n-z}}
function chart(p,l,data){let u=data.filter(x=>x.v>0),t=u.reduce((s,x)=>s+x.v,0),pie=$(p),leg=$(l);if(!t){pie.className='pie empty';pie.textContent='記録なし';pie.style.background='#e9e9e5';leg.innerHTML='<span class="sub">まだ記録がありません</span>';return}pie.className='pie';pie.textContent='';let deg=0;pie.style.background='conic-gradient('+u.map((x,i)=>{let st=deg,en=deg+x.v/t*360;deg=en;return (x.color||colors[i%colors.length])+' '+st+'deg '+en+'deg'}).join(',')+')';leg.innerHTML=u.map((x,i)=>'<div class="leg"><i class="dot" style="background:'+(x.color||colors[i%colors.length])+'"></i><span>'+esc(x.n)+'</span><span>'+yen(x.v)+'<small>'+(x.v/t*100).toFixed(1)+'%</small></span></div>').join('')}
function dash(){let t=total(now);$('balance').textContent=yen(t.b);$('grossTotal').textContent=yen(t.g);$('deductTotal').textContent=yen(t.c);$('netTotal').textContent=yen(t.n);$('expenseTotal').textContent=yen(t.z);chart('incomePie','incomeLegend',core.map((n,i)=>({n,v:t.a.filter(x=>work(x.work||x.store)===n).reduce((s,x)=>s+net(x),0),color:colors[i]})));chart('expensePie','expenseLegend',cats().map((n,i)=>({n,v:t.e.filter(x=>x.category===n).reduce((s,x)=>s+(Number(x.amount)||0),0),color:colors[i]})))}
function options(){let w=$('incomeWork').value;$('incomeWork').innerHTML=jobs().map(x=>'<option>'+esc(x)+'</option>').join('');$('incomeWork').value=jobs().includes(w)?w:'愛';let c=$('expenseCategory').value;$('expenseCategory').innerHTML=cats().map(x=>'<option>'+esc(x)+'</option>').join('');$('expenseCategory').value=cats().includes(c)?c:cats()[0];ai()}
function ai(){let a=$('incomeWork').value==='愛';$('aiFields').classList.toggle('hidden',!a);$('plainAmount').classList.toggle('hidden',a);preview()}function preview(){$('netPreview').textContent=yen(Math.max(0,(Number($('grossAmount').value)||0)-(Number($('withholdingTax').value)||0)-(Number($('otherDeduction').value)||0)))}
function incomeCard(x){let w=work(x.work||x.store)||'収入',a=w==='愛'?net(x):Number(x.amount||0),detail=w==='愛'&&('grossAmount'in x||'withholdingTax'in x||'otherDeduction'in x)?' ・ 総支給 '+yen(gross(x))+' / 控除 '+yen(tax(x)+other(x))+' / 実受取 '+yen(net(x)):'';return '<article class="record"><div class="badge">収</div><div><div class="rtitle">'+esc(w)+'</div><div class="rsub">'+esc((x.date||'').replaceAll('-','/'))+detail+(x.memo?' ・ '+esc(x.memo):'')+'</div></div><div><div class="ramount">'+yen(a)+'</div><div class="actions"><button class="icon edit-income" data-id="'+esc(x.id)+'">✎</button><button class="icon delete delete-income" data-id="'+esc(x.id)+'">×</button></div></div></article>'}function expenseCard(x){return '<article class="record"><div class="badge exp">費</div><div><div class="rtitle">'+esc(x.category||'その他')+(x.payee?' ・ '+esc(x.payee):'')+'</div><div class="rsub">'+esc((x.date||'').replaceAll('-','/'))+(x.work?' ・ '+esc(x.work):'')+(x.memo?' ・ '+esc(x.memo):'')+'</div></div><div><div class="ramount">'+yen(x.amount)+'</div><div class="actions"><button class="icon edit-expense" data-id="'+esc(x.id)+'">✎</button><button class="icon delete delete-expense" data-id="'+esc(x.id)+'">×</button></div></div></article>'}
function history(){let m=$('historyMonth').value,a=items(entries,m).sort((x,y)=>(y.date||'').localeCompare(x.date||'')),e=items(expenses,m).sort((x,y)=>(y.date||'').localeCompare(x.date||''));$('incomeHistory').innerHTML=a.length?a.map(incomeCard).join(''):'<div class="empty">この月の収入記録はありません。</div>';$('expenseHistory').innerHTML=e.length?e.map(expenseCard).join(''):'<div class="empty">この月の経費記録はありません。</div>'}
function summary(){let t=total($('summaryMonth').value),per=n=>t.a.filter(x=>work(x.work||x.store)===n).reduce((s,x)=>s+net(x),0),rows=[['愛の収入',per('愛')],['ジンの収入',per('ジン')],['シュシュの収入',per('シュシュ')],['総支給ベースの収入合計',t.g],['控除合計',t.c],['実受取額',t.n],['経費合計',t.z],['今月の収支',t.b]];$('summaryRows').innerHTML=rows.map((x,i)=>'<div class="row '+(i===7?'final':'')+'"><span>'+x[0]+'</span><b>'+yen(x[1])+'</b></div>').join('');$('summaryCats').innerHTML=cats().map(c=>'<div class="row"><span>'+esc(c)+'</span><b>'+yen(t.e.filter(x=>x.category===c).reduce((s,x)=>s+(Number(x.amount)||0),0))+'</b></div>').join('')}
function setting(){let tags=(a,k)=>a.map(x=>'<span class="tag">'+esc(x)+(!core.includes(x)&&!base.includes(x)?'<button data-kind="'+k+'" data-value="'+esc(x)+'">×</button>':'')+'</span>').join('');$('jobTags').innerHTML=tags(jobs(),'job');$('catTags').innerHTML=tags(cats(),'cat')}function render(){options();dash();history();summary();setting()}
function resetI(){editI=null;$('incomeTitle').textContent='収入を記録';$('saveIncome').textContent='＋ 収入を記録';$('incomeDate').value=d;$('incomeWork').value='愛';$('incomeAmount').value='';$('grossAmount').value='';$('withholdingTax').value='0';$('otherDeduction').value='0';$('incomeMemo').value='';ai()}function resetE(){editE=null;$('expenseTitle').textContent='経費を記録';$('saveExpense').textContent='＋ 経費を記録';$('expenseDate').value=d;$('expenseAmount').value='';$('expensePayee').value='';$('expenseMemo').value='';$('expenseWork').value='共通'}
function screen(id){document.querySelectorAll('.screen').forEach(x=>x.classList.toggle('active',x.id===id));document.querySelectorAll('.nav button').forEach(x=>x.classList.toggle('active',x.dataset.screen===id));scrollTo({top:0,behavior:'smooth'})}document.querySelectorAll('.nav button').forEach(b=>b.onclick=()=>screen(b.dataset.screen));document.querySelectorAll('.switch button').forEach(b=>b.onclick=()=>{document.querySelectorAll('.switch button').forEach(x=>x.classList.toggle('active',x===b));$('incomeForm').classList.toggle('hidden',b.dataset.form!=='income');$('expenseForm').classList.toggle('hidden',b.dataset.form!=='expense')});$('incomeWork').onchange=ai;['grossAmount','withholdingTax','otherDeduction'].forEach(x=>$(x).oninput=preview);
$('saveIncome').onclick=()=>{let w=$('incomeWork').value,date=$('incomeDate').value,memo=$('incomeMemo').value.trim(),v;if(w==='愛'){let g=Number($('grossAmount').value),t=Number($('withholdingTax').value)||0,o=Number($('otherDeduction').value)||0;if(!date||!g||g<0||t<0||o<0)return msg('日付と総支給額を入力してください。',true);v={id:editI||crypto.randomUUID(),date,store:w,work:w,amount:g,grossAmount:g,withholdingTax:t,otherDeduction:o,memo}}else{let a=Number($('incomeAmount').value);if(!date||!a||a<0)return msg('日付と金額を入力してください。',true);v={id:editI||crypto.randomUUID(),date,store:w,work:w,amount:a,memo}}if(editI)entries=entries.map(x=>x.id===editI?{...x,...v}:x);else entries.push(v);resetI();saveI();msg('収入を保存しました。')};
$('saveExpense').onclick=()=>{let a=Number($('expenseAmount').value),date=$('expenseDate').value;if(!date||!a||a<0)return msg('日付と金額を入力してください。',true);let v={id:editE||crypto.randomUUID(),date,amount:a,category:$('expenseCategory').value,payee:$('expensePayee').value.trim(),memo:$('expenseMemo').value.trim(),work:$('expenseWork').value};if(editE)expenses=expenses.map(x=>x.id===editE?{...x,...v}:x);else expenses.push(v);resetE();saveE();msg('経費を保存しました。')};
